name: "Publish LaTeX"
description: "Compile a LaTeX document into a PDF"

inputs:
  source:
    description: "Path to the LaTeX source file"
    required: true

runs:
  using: "composite"

  steps:
    - name: Install LaTeX
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          latexmk \
          texlive-latex-base \
          texlive-latex-recommended \
          texlive-latex-extra \
          texlive-fonts-recommended

    - name: Build publish-latex
      shell: bash
      working-directory: ${{ github.action_path }}
      run: cargo build --release

    - name: Compile LaTeX
      shell: bash
      run: |
        "${{ github.action_path }}/target/release/publish-latex" \
          "${{ inputs.source }}"

    - name: Prepare GitHub Pages
      shell: bash
      run: |
        mkdir -p _site

        PDF="${{ inputs.source }}"
        PDF="${PDF%.tex}.pdf"

        cp "$PDF" _site/document.pdf

        cat > _site/index.html <<'EOF'
        <!doctype html>
        <html>
          <head>
            <meta charset="utf-8">
            <title>PDF Document</title>
            <style>
              html, body {
                margin: 0;
                width: 100%;
                height: 100%;
              }

              embed {
                width: 100%;
                height: 100%;
              }
            </style>
          </head>
          <body>
            <embed src="document.pdf" type="application/pdf">
          </body>
        </html>
        EOF

    - name: Upload GitHub Pages artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: _site